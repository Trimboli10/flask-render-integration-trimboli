<!DOCTYPE html>
<html>
<head>
    <title>Sales Forecast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        label {
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        input[type="submit"] {
            background-color: #333;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        input[type="submit"]:hover {
            background-color: #555;
        }
        table {
            margin-top: 30px;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 10px 20px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <h2>Sales Forecast</h2>

    <form action="/" method="post">
        <label for="steps">Forecast days: <span id="slider-value">{{ steps }}</span></label><br>
        <input type="range" id="steps" name="steps" min="1" max="90" value="{{ steps }}"
               oninput="document.getElementById('slider-value').textContent = this.value">
        <br>
        <input type="submit" value="Predict">
    </form>

    {% if forecast %}
        <table>
            <tr>
                <th>Date</th>
                <th>Predicted Sales</th>
            </tr>
            {% for date, value in forecast %}
            <tr>
                <td>{{ date }}</td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}

</body>
</html>
